name: Validação web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find onboarding_site/public/js -name '*.js' -exec node --check {} \;
      - run: python3 -m json.tool onboarding_site/firebase.json > /dev/null
