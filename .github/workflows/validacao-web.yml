name: Validação web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find onboarding_site/public/js -name '*.js' -exec node --check {} \;
      - run: python3 -m json.tool onboarding_site/firebase.json > /dev/null
      # CSS precisa ter fallback para navegadores legados (iOS 15 / Safari 15).
      # Bug do iPhone 6s: cqw fora de @supports quebrava o simulador inteiro.
      - run: python3 scripts/check-legacy-css.py
      - run: node --check clinicas_site/public/assets/site.js
      - run: node --check clinicas_site/public/assets/faq.js
      - run: node --test scripts/tests/test-clinicas-faq.cjs scripts/tests/test-clinicas-consent.cjs
      - run: node --check clinicas_site/public/assets/consent.js
      - run: python3 scripts/build-clinicas.py
      - run: git diff --exit-code -- clinicas_site/public/data/hospitais.json
      - run: python3 -m unittest discover -s scripts/tests -p 'test_clinicas.py'
      - run: python3 -m json.tool clinicas_site/firebase.json > /dev/null
      - run: node --check clinicas_site/functions/index.js
      - run: node --test clinicas_site/functions/render.test.cjs
