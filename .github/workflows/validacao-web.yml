name: Validação web
on:
  push:
    branches: ['master', 'fix/**', 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
